name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install qitos
        run: pip install "qitos[models]>=0.4.0"
      - name: Install qitos-zoo
        run: pip install -e ".[dev]"
      - name: Run qitos_cyber unit tests
        run: python -m pytest qitos_cyber/tests/test_pentagi.py -q
      - name: Run qitos_auditor tests
        run: python -m pytest qitos_auditor/tests/ -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          pip install build twine
          python -m build
          twine check dist/*
